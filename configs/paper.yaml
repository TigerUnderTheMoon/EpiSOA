run_id: pubevent-soa-lite-human-gold-v2-paper
mode: paper
seed: 42
data:
  events_path: data/pubevent_soa_lite/events.jsonl
  raw_posts_path: data/pubevent_soa_lite/raw/raw_posts.jsonl
  evidence_candidates_path: data/pubevent_soa_lite/interim/evidence_candidates.jsonl
  evidence_path: data/pubevent_soa_lite/evidence_v3_repaired_plus_low37.jsonl
  annotation_sheet_path: data/pubevent_soa_lite/human_gold_v2/adjudicated_human_tuple_sheet.csv
  gold_tuples_path: data/pubevent_soa_lite/human_gold_v2/human_gold_tuples_v2.jsonl
  gold_event_chains_path: data/pubevent_soa_lite/human_gold_v2/human_gold_event_chains_v2.jsonl
output:
  runs_dir: outputs/runs_human_gold_v2
ablation:
  method_version: soe_v3
  max_evidence_per_event: 24
  max_tuples_per_event: 8
  evidence_selector:
    mode: coverage_optimized
model:
  mode: real
  llm_mode: real
  provider: openai_compatible
  llm_model: "gpt-5.5"
  model_name: "gpt-5.5"
  embedding_model: mock-embedding
  reranker_model: mock-reranker
  api_key: ""
  api_key_env: "OPENAI_API_KEY"
  base_url: ""
  base_url_env: "OPENAI_BASE_URL"
  temperature: 0.1
  max_tokens: 8000
  timeout_seconds: 180
  max_retries: 2
search:
  provider: custom
  api_key: ""
  api_key_env: SEARCH_API_KEY
  base_url: ""
  base_url_env: SEARCH_BASE_URL
  timeout_seconds: 30
  max_retries: 2
collector:
  source_types:
    - news
    - official
    - public_interaction
    - forum
    - public_social
    - public_web
  max_results_per_query: 10
  max_evidence_per_event: 50
  sleep_seconds: 0.5
retrieval:
  top_k: 5
verifier:
  threshold: 0.75
